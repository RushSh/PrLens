[project]
name = "bugcensus"
version = "0.1.0"
description = "BugCensus: plant decoy bugs to estimate how many real bugs AI code review missed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
modal = ["modal>=0.64"]

[project.scripts]
bugcensus = "bugcensus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugcensus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
